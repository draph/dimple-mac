<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Settings gate regression</title>
<body><output id="result">Running…</output><div id="root"></div>
<script type="module">
// Run with npm run dev, then open /tests/settings-gate.html.
import React, { act, useState } from 'react';
import { createRoot } from 'react-dom/client';
import { mockIPC } from '@tauri-apps/api/mocks';
import { emit } from '@tauri-apps/api/event';
import { ShortcutSettings } from '../src/ShortcutSettings.tsx';
import { createAppearance } from '../src/appearance.ts';
import '../src/App.css';

globalThis.IS_REACT_ACT_ENVIRONMENT = true;
const appearance = createAppearance(() => localStorage, matchMedia('(prefers-color-scheme: dark)'), document.documentElement);
const status = { settings: { enabled: true, shortcut: 'alt+KeyF' }, active: ['alt+KeyF'], uncertain: [], saved: false, error: null, open: false, capturing: false };
let setBlocked, setLocale, setVersion, visible = false, restored = 0, delay = false, release;
let takeUpdate = false;
let opened = 'unset';
let fetchFails = false;
let releases = [{ tag_name: 'v2.3.4', draft: false, prerelease: false }];
mockIPC(async (cmd, args) => {
  if (cmd === 'get_shortcut_settings') {
    const value = structuredClone(status);
    if (delay) { delay = false; await new Promise(done => release = done); }
    return value;
  }
  if (cmd === 'close_settings') status.open = false;
  if (cmd === 'set_shortcut_capture') status.capturing = !!args.capturing;
  if (cmd === 'take_update_check') { const value = takeUpdate; takeUpdate = false; return value; }
  if (cmd === 'open_releases') opened = args.tag;
}, { shouldMockEvents: true });
globalThis.fetch = async () => {
  if (fetchFails) throw new Error('offline');
  return new Response(JSON.stringify(releases), { status: 200, headers: { 'Content-Type': 'application/json' } });
};
function Harness() {
  const [blocked, update] = useState(false);
  const [locale, updateLocale] = useState('en');
  const [version, updateVersion] = useState('9.8.7');
  setBlocked = update;
  setLocale = updateLocale; setVersion = updateVersion;
  return React.createElement(ShortcutSettings, { locale, version, blocked, onOpenChange: open => { visible = open; }, onClosed: () => { restored++; },
    appearance, language: { locale, preference: 'system', revision: 0 }, onSelectLanguage: async () => {} });
}
const root = createRoot(document.querySelector('#root'));
let assertions = 0;
const check = (condition, message) => { if (!condition) throw new Error(message); assertions++; };
const open = async (late = false) => {
  status.open = true; delay = late;
  await act(async () => { await emit('shortcut-settings'); });
};
const settle = async () => {
  await act(async () => { await new Promise(done => setTimeout(done, 0)); });
};
const about = () => document.querySelector('.about');
const checkButton = () => about()?.querySelector('.check-updates');
const updateStatus = () => about()?.querySelector('.about-status');
const downloadButton = () => about()?.querySelector('.about-download');
try {
  await act(async () => root.render(React.createElement(Harness)));
  await open();
  check(visible, 'Idle settings must open');
  for (const [locale, title, version, checkText] of [
    ['en', 'About', 'Version 9.8.7', 'Check for updates'],
    ['zh-Hans', '关于', '版本 9.8.7', '检查更新'],
  ]) {
    await act(async () => setLocale(locale));
    const section = about();
    const button = checkButton();
    check(section.getAttribute('aria-labelledby') === 'about-title' && section.querySelector('h2').textContent === title, 'About must have a localized accessible heading');
    check(section.textContent.includes(version), 'About must show the supplied version');
    check(!button.disabled && button.textContent === checkText, 'Update must be enabled and localized');
    check(!button.hasAttribute('aria-describedby'), 'Update must not describe itself as unavailable');
    check(!section.querySelector('.about-status'), 'Idle update state must not render a result');
  }
  await act(async () => { setLocale('en'); setVersion('2.3.4'); });
  check(about().textContent.includes('Version 2.3.4'), 'Version changes must render from props');

  releases = [{ tag_name: 'v2.3.4', draft: false, prerelease: false }];
  await act(async () => { checkButton().click(); });
  await settle();
  check(updateStatus()?.textContent === "You're up to date", 'Equal versions must report up to date without repeating the version');
  check(updateStatus()?.parentElement === checkButton()?.parentElement, 'The update result must share the version row');
  check(!checkButton().disabled, 'Checking must re-enable the button');

  releases = [{ tag_name: 'v2.4.0', draft: false, prerelease: false }];
  await act(async () => { checkButton().click(); });
  await settle();
  const available = updateStatus();
  check(available?.textContent.includes('Version 2.4.0 is available'), 'A newer release must be announced without repeating the current version');
  const download = downloadButton();
  check(download?.textContent.includes('Download'), 'A newer release must expose a download button');
  check(download?.parentElement === available?.parentElement, 'An available update must share the version row');
  opened = 'unset';
  await act(async () => { download?.click(); });
  check(opened === 'v2.4.0', 'Download must open the selected release tag');

  releases = [{ tag_name: 'v2.5.0', draft: false, prerelease: true }];
  takeUpdate = true;
  await act(async () => { await emit('update-check'); });
  await settle();
  check(updateStatus()?.textContent.includes('pre-release'), 'Prereleases must be labeled');

  releases = [];
  takeUpdate = true;
  await act(async () => { await emit('update-check'); });
  await settle();
  check(about().querySelector('[role="alert"]')?.textContent.includes('Could not check for updates'), 'An empty release list must be reported as a failed check');
  check(checkButton()?.textContent === 'Check for updates', 'A failed check must offer retry');
  check(!downloadButton(), 'A failed check must not offer a download');

  fetchFails = true;
  await act(async () => { checkButton().click(); });
  await settle();
  check(about().querySelector('[role="alert"]')?.textContent.includes('Could not check for updates'), 'Network failures must be reported');
  check(about().querySelectorAll('.about-row button').length === 1, 'A failed check must offer only retry');
  fetchFails = false;

  releases = [{ tag_name: 'v2.6.0', draft: false, prerelease: false }];
  await act(async () => { checkButton().click(); });
  await settle();
  await act(async () => setLocale('zh-Hans'));
  check(updateStatus()?.textContent === '发现新版本 2.6.0', 'Update results must follow the current language');
  await act(async () => setLocale('en'));

  releases = [{ tag_name: 'v2.3.4', draft: false, prerelease: false }];
  takeUpdate = true;
  await act(async () => { await emit('update-check'); });
  await settle();
  check(updateStatus()?.textContent === "You're up to date", 'The menu entry must run the same check');

  await act(async () => setBlocked(true));
  check(!visible && !status.open, 'Starting an operation must close settings');
  check(restored === 0, 'Automatic closes must not restore focus');
  await open();
  check(!visible && !status.open, 'A blocked native request must be discarded');
  await open(true);
  check(!visible, 'A delayed native request must not cover progress');
  await act(async () => setBlocked(false));
  check(!visible && !status.open, 'An aborted preparation must not queue settings');
  await open();
  check(visible && status.open, 'An explicit request after completion must open settings');
  await act(async () => release());
  check(visible && status.open, 'A stale blocked response must preserve a later explicit request');
  await act(async () => document.querySelector('button').click());
  check(!visible && !status.open, 'Back must close settings');
  check(restored === 1, 'Back must restore focus');
  await act(async () => setBlocked(true));
  await open(true);
  await act(async () => setBlocked(false));
  await act(async () => release());
  check(!visible && !status.open, 'A late response must not reopen settings without a new request');
  document.querySelector('#result').textContent = `PASS: ${assertions} settings, about and update assertions`;
} catch (error) {
  document.querySelector('#result').textContent = `FAIL: ${error.message}`;
  throw error;
} finally {
  await act(async () => root.unmount());
}
</script></body></html>
