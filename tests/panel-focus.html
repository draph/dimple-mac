<!doctype html><meta charset="utf-8"><title>Panel focus reset regression</title>
<p id="result" role="status">Running…</p><div id="root"></div>
<script type="module">
// Run with npm run dev, then open /tests/panel-focus.html.
import React, { act } from 'react';
import { createRoot } from 'react-dom/client';
import { mockIPC } from '@tauri-apps/api/mocks';
import { emit } from '@tauri-apps/api/event';
import App from '/src/App.tsx';
import { defaultParams } from '/src/renderParams.ts';
import { createAppearance } from '/src/appearance.ts';
globalThis.IS_REACT_ACT_ENVIRONMENT = true;
const png = btoa(String.fromCharCode(...new Uint8Array(await (await fetch('/tests/fixtures/badges/color/normalized/color-svg.png')).arrayBuffer())));
const entry = {params:{...defaultParams},badge:{id:'code',width:80,height:48,opaque:false,effects:['engraved'],text:null},badgeError:null,importing:false,text:null,textCount:null,textPending:false,revision:1,editRevision:1,source:'picker',items:[{id:'folder',path:'/tmp/isolated-test',actualPath:'/tmp/isolated-test',linked:false,kind:'directory',error:null}],issues:[],error:null,choosing:false,reading:false,checking:false,preparing:false};
const session = {version:'test',locale:'en',entry,operation:{canStop:false,canRetry:false,canContinue:false,revision:1,prepared:null,progress:null}};
const settings = {settings:{enabled:false,shortcut:'alt+KeyF'},active:[],uncertain:[],saved:false,error:null,open:false,capturing:false};
let holdClose = false, releaseClose;
mockIPC(async (cmd) => {
  if (cmd === 'get_session') return structuredClone(session);
  if (cmd === 'get_language') return {locale:'en',preference:'system',revision:0};
  if (cmd === 'get_shortcut_settings') return structuredClone(settings);
  if (cmd === 'get_badge_mask') return png;
  if (cmd === 'close_settings') {
    settings.open = false;
    if (holdClose) { holdClose = false; await new Promise(resolve => { releaseClose = resolve; }); }
  }
}, {shouldMockEvents:true});
const root = createRoot(document.querySelector('#root'));
const appearance = createAppearance(() => localStorage, matchMedia('(prefers-color-scheme: dark)'), document.documentElement);
let assertions = 0;
const check = (ok, message) => { if (!ok) throw Error(message); assertions++; };
const settle = async condition => {
  for (let i = 0; i < 60; i++) {
    await act(async () => { await new Promise(requestAnimationFrame); });
    if (condition()) return;
  }
  throw Error('UI did not settle');
};
const hide = async () => act(async () => { await emit('panel-visibility', false); });
const show = async () => {
  await act(async () => { await emit('panel-visibility', true); });
  check(document.activeElement === document.body, 'Showing the panel must not restore stale focus');
};
const openSettings = async () => {
  settings.open = true;
  await act(async () => { document.querySelector('.settings-button').click(); await emit('shortcut-settings'); });
  await settle(() => !!document.querySelector('.settings'));
};
try {
  await act(async () => root.render(React.createElement(App, { appearance })));
  await settle(() => !!document.querySelector('.settings-button') && !!document.querySelector('.icon-filters input'));

  const search = document.querySelector('.icon-filters input');
  search.focus();
  check(document.activeElement === search, 'The search input must take focus');
  await hide();
  check(document.activeElement === document.body, 'Hiding the panel must clear input focus');
  await show();

  await act(async () => document.querySelector('.folder-selection-trigger').click());
  check(!document.querySelector('#folder-selection-menu').hidden, 'The folder menu must open');
  check(document.activeElement === document.querySelector('#folder-selection-menu button'), 'The folder menu must focus its item');
  await hide();
  check(document.querySelector('#folder-selection-menu').hidden, 'Hiding the panel must close the folder menu');
  await show();

  await act(async () => document.querySelector('.adjustments-trigger').click());
  check(!document.querySelector('#adjustments-panel').hidden, 'Adjustments must open');
  await act(async () => { document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' })); });
  check(document.querySelector('#adjustments-panel').hidden, 'Escape must close adjustments');
  check(document.activeElement === document.querySelector('.adjustments-trigger'), 'Escape must focus the adjustments trigger');
  await act(async () => document.querySelector('.adjustments-trigger').click());
  check(!document.querySelector('#adjustments-panel').hidden, 'Adjustments must reopen');
  await hide();
  check(document.querySelector('#adjustments-panel').hidden, 'Hiding the panel must close adjustments');
  await show();

  await openSettings();
  check(document.activeElement?.classList.contains('settings'), 'Opening settings must focus its section');
  await hide();
  check(document.activeElement === document.body, 'Hiding settings must clear its focus');
  settings.open = false;
  await act(async () => { await emit('shortcut-settings'); });
  await settle(() => !document.querySelector('.settings'));
  await show();
  check(document.activeElement === document.body, 'An automatic settings close must not focus the gear');

  await openSettings();
  await act(async () => document.querySelector('.settings-back').click());
  await settle(() => !document.querySelector('.settings'));
  check(document.activeElement?.classList.contains('settings-button'), 'An explicit settings close must focus the gear');

  await openSettings();
  holdClose = true;
  await act(async () => document.querySelector('.settings-back').click());
  await hide();
  check(!!document.querySelector('.settings'), 'The delayed settings close must still be pending');
  await act(async () => { releaseClose(); });
  await settle(() => !document.querySelector('.settings'));
  await show();
  check(document.activeElement === document.body, 'A settings close finishing after hiding must not focus the gear');

  await openSettings();
  holdClose = true;
  await act(async () => document.querySelector('.settings-back').click());
  await hide();
  await show();
  check(!!document.querySelector('.settings'), 'The delayed settings close must survive a reopen');
  await act(async () => { releaseClose(); });
  await settle(() => !document.querySelector('.settings'));
  check(document.activeElement === document.body, 'A settings close finishing after a reopen must not focus the gear');

  document.querySelector('#result').textContent = `PASS: ${assertions} panel focus assertions`;
} catch (error) {
  document.querySelector('#result').textContent = `FAIL: ${error.message}`;
  throw error;
} finally {
  await act(async () => root.unmount());
}
</script></body></html>
