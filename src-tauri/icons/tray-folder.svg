  <g stroke="#000000" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Folder's tab and smoothly rounded outer body, with a modest snow-shaped upper contour. -->
    <path d="M10 43 C9 35 13 26 20 21 C27 16 35 17 42 21 C48 19 54 22 58 27 C60 29 61 31 61 33 L78 33 C86 33 92 39 92 47 L92 77 C92 84 87 89 80 89 L20 89 C12 89 8 84 8 76 L8 47"/>
    <!-- Subtle, irregular snowcap on the tab, with no tiny frost texture. -->
    <path d="M10 44 C16 47 20 40 25 38 C30 35 34 40 39 39 C44 38 46 35 51 36 C55 37 58 37 61 33"/>
    <!-- One flowing snow-covered front lip and one short icicle formed in the same line. -->
    <path d="M10 57 C20 49 30 52 39 54 C50 57 61 49 72 48 C79 47 82 50 83 56 L84 62 C84.5 65 86.5 65 87 62 L88 56 C89 52 91 51 92 52"/>
  </g>
</svg>
