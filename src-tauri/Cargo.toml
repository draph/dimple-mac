[package]
name = "dimple"
version = "1.0.1"
description = "A macOS menu bar app for customizing folder icons"
license = "MIT"
edition = "2024"

[[bin]]
name = "Dimple"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dimple_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
libc = "0.2"
block2 = "=0.6.2"
base64 = "=0.23.1"
png = "=0.18.1"
resvg = { version = "=0.49.0", default-features = false }
roxmltree = "=0.21.1"
svgtypes = "=0.16.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFString", "CFAttributedString", "CFData", "CFNumber"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGContext", "CGImage", "CGColorSpace"] }
objc2-core-text = { version = "=0.3.2", default-features = false, features = ["std", "CTFont", "CTLine", "CTRun", "CTStringAttributes", "objc2-core-graphics"] }
objc2-app-kit = { version = "=0.3.2", features = ["NSImage", "NSDragging", "NSPasteboard", "NSPasteboardItem", "NSView", "NSApplication", "NSWorkspace", "NSRunningApplication", "NSStatusItem", "NSStatusBarButton"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSBundle", "NSArray", "NSString", "NSURL", "NSGeometry", "NSObject", "NSError", "NSData", "NSFileCoordinator", "block2"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Isolated native-write probe; these dependencies are not shipped in the app.
[target.'cfg(target_os = "macos")'.dev-dependencies]
tauri = { version = "~2.12", features = ["test"] }
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSImage", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSFileCoordinator", "NSError", "block2"] }
block2 = "=0.6.2"

[patch.crates-io]
global-hotkey = { path = "vendor/global-hotkey" }
